<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUSHAE — Second Skin, First Choice.</title>
    <meta name="description" content="Premium innerwear for men and women. Made in Pakistan, finished to an international standard." />
    <meta name="theme-color" content="#FBF9F6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Luxury fashion type system — LV / CK / Gucci / Nike register.
        · Jost  — Futura-style geometric sans (Louis Vuitton, Nike DNA) → display
        · Inter — Helvetica-style neutral (Calvin Klein DNA) → body/UI
        · Cormorant Garamond — Didot-style serif (Gucci editorial) → accents
      Fonts load without blocking the first paint. The stylesheet is fetched at
      low priority and only promoted to a real stylesheet once it arrives, so
      the hero headline paints in the fallback face immediately and swaps.
    -->
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
